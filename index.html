<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="screen-orientation" content="landscape">
		<title>Mining Dive</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	overflow: hidden;
	touch-action: none;
	height: 100%;
	height: 100dvh;
	width: 100%;
	width: 100dvw;
}

html, body {
	position: fixed;
	inset: 0;
	overscroll-behavior: none;
}

body {
	color: white;
	background-color: black;
}

#canvas {
	display: block;
	pointer-events: auto;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	pointer-events: none;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#rotate-hint {
	display: none;
	pointer-events: none;
	position: fixed;
	inset: 0;
	z-index: 10000;
	background: rgba(0, 0, 0, 0.88);
	color: #fff;
	font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
	font-size: clamp(1.1rem, 4.5vw, 1.7rem);
	letter-spacing: 0.12em;
	align-items: center;
	justify-content: center;
	text-align: center;
	padding: 1.5rem;
	touch-action: none;
}

#fs-overlay {
	display: none;
	pointer-events: none;
	position: fixed;
	inset: 0;
	z-index: 9000;
	background: rgba(0, 0, 0, 0.78);
	color: #fff;
	font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
	font-size: clamp(1.05rem, 4vw, 1.6rem);
	letter-spacing: 0.14em;
	align-items: center;
	justify-content: center;
	text-align: center;
	padding: 1.5rem;
	touch-action: none;
	user-select: none;
	-webkit-user-select: none;
	cursor: pointer;
}

#fs-overlay.visible {
	display: flex;
	pointer-events: auto;
}

#fs-reenter {
	display: none;
	position: fixed;
	top: max(0.65rem, env(safe-area-inset-top));
	right: max(0.65rem, env(safe-area-inset-right));
	z-index: 9001;
	margin: 0;
	padding: 0.45rem 0.9rem;
	border: 1px solid rgba(255, 255, 255, 0.45);
	border-radius: 999px;
	background: rgba(0, 0, 0, 0.62);
	color: #fff;
	font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
	font-size: 0.85rem;
	letter-spacing: 0.08em;
	cursor: pointer;
	touch-action: manipulation;
	user-select: none;
	-webkit-user-select: none;
}

#fs-reenter.visible {
	display: block;
}

@media (orientation: portrait) {
	#rotate-hint {
		display: flex;
		pointer-events: auto;
	}

	#fs-overlay.visible,
	#fs-reenter.visible {
		display: none;
		pointer-events: none;
	}
}

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			JavaScript を有効にしてください。
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="fs-overlay" role="button" tabindex="0" aria-hidden="true">タップして全画面で遊ぶ</div>
		<button id="fs-reenter" type="button" aria-hidden="true">全画面</button>
		<div id="rotate-hint" role="dialog" aria-live="polite">画面を横にしてください</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":17744120,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const hint = document.getElementById('rotate-hint');
	const fsOverlay = document.getElementById('fs-overlay');
	const fsReenter = document.getElementById('fs-reenter');
	const canvas = document.getElementById('canvas');

	let gameReady = false;
	let overlayDismissed = false;

	function isLandscape() {
		const type = (screen.orientation && screen.orientation.type) || '';
		if (type) {
			return type.indexOf('landscape') === 0;
		}
		if (window.matchMedia) {
			return window.matchMedia('(orientation: landscape)').matches;
		}
		return window.innerWidth >= window.innerHeight;
	}

	function hasFullscreenApi(el) {
		if (!el) {
			return false;
		}
		return typeof (el.requestFullscreen
			|| el.webkitRequestFullscreen
			|| el.webkitRequestFullScreen
			|| el.mozRequestFullScreen
			|| el.msRequestFullscreen) === 'function';
	}

	function canFullscreen() {
		return hasFullscreenApi(document.documentElement) || hasFullscreenApi(canvas);
	}

	function fullscreenElement() {
		return document.fullscreenElement
			|| document.webkitFullscreenElement
			|| document.mozFullScreenElement
			|| document.msFullscreenElement
			|| null;
	}

	function isFullscreen() {
		return !!fullscreenElement();
	}

	function requestFullscreenOn(el) {
		if (!el) {
			return Promise.reject(new Error('no element'));
		}
		const fn = el.requestFullscreen
			|| el.webkitRequestFullscreen
			|| el.webkitRequestFullScreen
			|| el.mozRequestFullScreen
			|| el.msRequestFullscreen;
		if (typeof fn !== 'function') {
			return Promise.reject(new Error('no fullscreen'));
		}
		try {
			const result = fn.call(el);
			if (result && typeof result.then === 'function') {
				return result;
			}
			return Promise.resolve();
		} catch (err) {
			return Promise.reject(err);
		}
	}

	function enterFullscreen() {
		return requestFullscreenOn(document.documentElement).catch(function () {
			return requestFullscreenOn(canvas);
		});
	}

	function tryLockLandscape() {
		try {
			if (screen.orientation && typeof screen.orientation.lock === 'function') {
				screen.orientation.lock('landscape').catch(function () {});
			}
		} catch (err) {
			// Many browsers reject lock outside fullscreen / installed PWA.
		}
	}

	function setVisible(el, visible) {
		if (!el) {
			return;
		}
		if (visible) {
			el.classList.add('visible');
			el.setAttribute('aria-hidden', 'false');
		} else {
			el.classList.remove('visible');
			el.setAttribute('aria-hidden', 'true');
		}
	}

	function updateRotateHint() {
		if (!hint) {
			return;
		}
		const landscape = isLandscape();
		hint.style.display = landscape ? 'none' : 'flex';
		hint.style.pointerEvents = landscape ? 'none' : 'auto';
		hint.setAttribute('aria-hidden', landscape ? 'true' : 'false');
	}

	function updateFullscreenUi() {
		const landscape = isLandscape();
		const fs = isFullscreen();
		const api = canFullscreen();

		// No Fullscreen API (typical iOS Safari): never show 全画面 copy, just play.
		const showOverlay = gameReady && !overlayDismissed && landscape && api && !fs;
		const showReenter = gameReady && overlayDismissed && landscape && api && !fs;
		setVisible(fsOverlay, showOverlay);
		setVisible(fsReenter, showReenter);
	}

	function hideOverlayAndPlay() {
		overlayDismissed = true;
		setVisible(fsOverlay, false);
		if (canvas && typeof canvas.focus === 'function') {
			canvas.focus();
		}
		updateFullscreenUi();
	}

	function onFirstFullscreenGesture(ev) {
		if (overlayDismissed) {
			return;
		}
		if (ev) {
			ev.preventDefault();
			ev.stopPropagation();
		}
		const request = enterFullscreen();
		hideOverlayAndPlay();
		request.then(function () {
			tryLockLandscape();
			updateFullscreenUi();
		}).catch(function () {
			updateFullscreenUi();
		});
	}

	function onReenter(ev) {
		if (ev) {
			ev.preventDefault();
			ev.stopPropagation();
		}
		enterFullscreen().then(function () {
			tryLockLandscape();
			updateFullscreenUi();
		}).catch(function () {
			updateFullscreenUi();
		});
	}

	window.__miningDiveOnGameReady = function () {
		gameReady = true;
		if (!canFullscreen()) {
			overlayDismissed = true;
		}
		updateFullscreenUi();
	};

	if (fsOverlay) {
		fsOverlay.addEventListener('click', onFirstFullscreenGesture);
	}
	if (fsReenter) {
		fsReenter.addEventListener('click', onReenter);
	}

	['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (name) {
		document.addEventListener(name, function () {
			if (isFullscreen()) {
				overlayDismissed = true;
				setVisible(fsOverlay, false);
				tryLockLandscape();
			}
			updateFullscreenUi();
		});
	});

	updateRotateHint();
	updateFullscreenUi();
	tryLockLandscape();
	window.addEventListener('orientationchange', function () {
		updateRotateHint();
		updateFullscreenUi();
		tryLockLandscape();
	});
	window.addEventListener('resize', function () {
		updateRotateHint();
		updateFullscreenUi();
	});
	if (screen.orientation && screen.orientation.addEventListener) {
		screen.orientation.addEventListener('change', function () {
			updateRotateHint();
			updateFullscreenUi();
		});
	}
	window.addEventListener('pointerdown', tryLockLandscape, { passive: true });
	window.addEventListener('touchend', tryLockLandscape, { passive: true });
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.style.display = 'none';
			statusOverlay.style.pointerEvents = 'none';
			statusOverlay.remove();
			initializing = false;
			if (typeof window.__miningDiveOnGameReady === 'function') {
				window.__miningDiveOnGameReady();
			}
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusOverlay.style.pointerEvents = 'auto';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
